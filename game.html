<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Тапай!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background: radial-gradient(ellipse at center, #1a0033 0%, #000 100%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; z-index: 10; text-shadow: 0 0 10px rgba(255,0,255,0.6); }
  #score { color: #ff00ff; }
  #time { color: #00ffff; }
  #field { position: relative; width: 100%; height: 100%; }
  .star { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #ffeb3b, #ff00ff); box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; animation: pop .3s ease-out; }
  .bomb { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle, #555, #000); box-shadow: 0 0 15px #f00; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes fade { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }
  .pop { animation: pop .2s ease-out forwards; }
  #start, #end { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  #start h1, #end h1 { font-size: 42px; margin-bottom: 12px; background: linear-gradient(90deg, #ff00ff, #00ffff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p, #end p { font-size: 16px; margin-bottom: 24px; opacity: 0.8; text-align: center; }
  .btn { padding: 16px 40px; font-size: 20px; font-weight: 700; border: none; border-radius: 50px; background: linear-gradient(90deg, #ff00ff, #00ffff); color: #000; cursor: pointer; box-shadow: 0 0 30px rgba(255,0,255,0.5); }
  .btn:active { transform: scale(0.95); }
  .hidden { display: none !important; }
  #end .share { margin-top: 12px; background: linear-gradient(90deg, #00ffff, #ff00ff); }
  #final { font-size: 56px; font-weight: 900; color: #ffeb3b; margin: 8px 0 16px; text-shadow: 0 0 20px #ff00ff; }
</style>
</head>
<body>

<div id="hud" class="hidden">
  <div id="score">⭐ 0</div>
  <div id="time">⏱ 30</div>
</div>

<div id="field"></div>

<div id="start">
  <h1>ТАПАЙ! ⭐</h1>
  <p>Лови звёзды, избегай бомб<br>У тебя 30 секунд</p>
  <button class="btn" onclick="startGame()">▶ ИГРАТЬ</button>
</div>

<div id="end" class="hidden">
  <h1>ВРЕМЯ! 🏁</h1>
  <p>Твой результат:</p>
  <div id="final">0</div>
  <button class="btn" onclick="startGame()">🔄 ЕЩЁ</button>
  <button class="btn share" onclick="shareScore()">📤 ПОДЕЛИТЬСЯ</button>
</div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  let score = 0, timeLeft = 30, timerId = null, spawnId = null;
  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const startEl = document.getElementById('start');
  const endEl = document.getElementById('end');
  const finalEl = document.getElementById('final');
  const hudEl = document.getElementById('hud');

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function spawn() {
    const isBomb = Math.random() < 0.2;
    const el = document.createElement('div');
    el.className = isBomb ? 'bomb' : 'star';
    el.textContent = isBomb ? '💣' : '⭐';
    el.style.left = rand(20, window.innerWidth - 80) + 'px';
    el.style.top = rand(80, window.innerHeight - 100) + 'px';
    el.onclick = () => tap(el, isBomb);
    el.ontouchstart = (e) => { e.preventDefault(); tap(el, isBomb); };
    field.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  function tap(el, isBomb) {
    if (!el.parentNode) return;
    if (isBomb) {
      score = Math.max(0, score - 2);
    } else {
      score++;
    }
    scoreEl.textContent = '⭐ ' + score;
    el.style.animation = 'fade .2s ease-out forwards';
    setTimeout(() => el.remove(), 200);
  }

  function startGame() {
    score = 0; timeLeft = 50;
    scoreEl.textContent = '⭐ 0';
    timeEl.textContent = '⏱ 50';
    startEl.classList.add('hidden');
    endEl.classList.add('hidden');
    hudEl.classList.remove('hidden');
    field.innerHTML = '';
    timerId = setInterval(() => {
      timeLeft--;
      timeEl.textContent = '⏱ ' + timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
    spawnId = setInterval(spawn, 700);
  }

  function endGame() {
    clearInterval(timerId);
    clearInterval(spawnId);
    field.innerHTML = '';
    hudEl.classList.add('hidden');
    finalEl.textContent = score;
    endEl.classList.remove('hidden');
    if (tg) tg.HapticFeedback.notificationOccurred('success');
  }

  function shareScore() {
    const text = `Я набрал ${score} ⭐ в ТАПАЙ!\nПобей мой рекорд 👉 @your_bot`;
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent('https://t.me/Gmfrosbot')}&text=${encodeURIComponent(text)}`);
    } else if (navigator.share) {
      navigator.share({ text });
    } else {
      navigator.clipboard.writeText(text);
      alert('Скопировано! Вставь в Telegram');
    }
  }
</script>
</body>
</html>
